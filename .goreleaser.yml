version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ zip ]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: '{{ .Tag }}-next'
changelog:
  # Commit subjects since the previous tag: lazdo is pushed straight to
  # master, so GitHub's pull-request based notes come out empty. These are
  # also what `lazdo update` and U show before updating.
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '
