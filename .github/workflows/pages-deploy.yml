name: Deploy install scripts to Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/install.sh"
      - "website/install.ps1"
      - "website/CNAME"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Only the install scripts are published, at lazdo.khanhtd36.dev.
      - name: Assemble Pages payload
        run: |
          set -euo pipefail
          mkdir -p _site
          cp website/install.sh website/install.ps1 website/CNAME _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
